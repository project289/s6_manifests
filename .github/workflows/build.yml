name: Build LineageOS 22.1 for S6 Edge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git repo python3 openjdk-17-jdk \
            build-essential bc bison flex libssl-dev make \
            ccache libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            g++-multilib gcc-multilib lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libelf-dev \
            libxml2-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2-utils \
            lzma lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev

      - name: Setup ccache
        run: |
          ccache -M 20G
          echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Sync source
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage

          # Init with official LineageOS 22.1 manifest
          repo init -u https://github.com/LineageOS/android.git -b lineage-22.1

          # Create local manifest for your device
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/zeroltexx.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="project289/android_device_samsung_universal7420-common" path="device/samsung/universal7420-common" remote="github" revision="lineage-22.1" />
            <project name="project289/android_device_samsung_zeroltexx" path="device/samsung/zeroltexx" remote="github" revision="lineage-22.1" />
            <project name="project289/android_kernel_samsung_universal7420" path="kernel/samsung/universal7420" remote="github" revision="lineage-22.1" />
            <project name="project289/proprietary_vendor_samsung" path="vendor/samsung" remote="github" revision="lineage-22.1" />
            <project name="project289/7420_patches" path="patches/7420_patches" remote="github" revision="lineage-20.0" />
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="lineage-22.1" />
            <project name="LineageOS/android_hardware_samsung_slsi_exynos" path="hardware/samsung_slsi/exynos" remote="github" revision="lineage-19.1" />
            <project name="LineageOS/android_hardware_samsung_slsi_openmax" path="hardware/samsung_slsi/openmax" remote="github" revision="lineage-19.1" />
            <project name="samsungexynos7420/android_hardware_samsung_slsi-linaro_exynos" path="hardware/samsung_slsi/linaro_exynos" remote="github" revision="lineage-21.0" />
            <project name="samsungexynos7420/android_hardware_samsung_slsi-linaro_exynos5" path="hardware/samsung_slsi/linaro_exynos5" remote="github" revision="lineage-21.0" />
            <project name="samsungexynos7420/android_hardware_samsung_slsi-linaro_openmax" path="hardware/samsung_slsi/linaro_openmax" remote="github" revision="lineage-21.0" />
            <project name="samsungexynos7420/android_hardware_samsung_slsi-linaro_graphics" path="hardware/samsung_slsi/linaro_graphics" remote="github" revision="lineage-21.0" />
            <project name="samsungexynos7420/android_hardware_samsung_slsi-linaro_config" path="hardware/samsung_slsi/linaro_config" remote="github" revision="lineage-21.0" />
            <project name="samsungexynos7420/android_device_samsung_slsi_sepolicy" path="device/samsung/slsi_sepolicy" remote="github" revision="lineage-21" />
          </manifest>
          EOF

          repo sync -c -j2 --force-sync --no-clone-bundle --no-tags
          # Verify that build/envsetup.sh is present
          if [ ! -f build/envsetup.sh ]; then
            echo "❌ Sync failed: build/envsetup.sh not found"
            exit 1
          fi

      - name: Build ROM
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          export TARGET_PRODUCT=lineage_zeroltexx
          export TARGET_BUILD_VARIANT=userdebug
          export TARGET_RELEASE=aosp_current
          export TARGET_DEVICE=zeroltexx
          export NINJA_ARGS="-j3"
          make -j3 bacon

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lineage-zeroltexx
          path: ~/android/lineage/out/target/product/zeroltexx/*.zip
